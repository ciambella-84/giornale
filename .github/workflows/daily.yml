name: Giornale quotidiano
on:
  schedule:
    - cron: "0 5 * * *"   # ogni giorno alle 5:00 UTC (6-7 in Italia)
  workflow_dispatch:       # per lanciarlo a mano dal bottone "Run workflow"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Salva la nuova pagina
        run: |
          git config user.name "giornale-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Giornale del $(date +%F)" || echo "Nessun cambiamento"
          git push
